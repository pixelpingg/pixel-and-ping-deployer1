name: Deploy PIXEL & PING

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-ping-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy PIXEL & PING Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare real panel source
        shell: bash
        run: |
          set -euo pipefail
          test -s panel-source.zip
          rm -rf .panel-source
          mkdir -p .panel-source
          unzip -q panel-source.zip -d .panel-source
          PANEL_ROOT="$(find .panel-source -mindepth 1 -maxdepth 4 -type d -name frontend -print -quit | xargs -r dirname)"
          test -n "$PANEL_ROOT"
          test -d "$PANEL_ROOT/frontend"
          test -d "$PANEL_ROOT/worker"
          echo "PANEL_ROOT=$PANEL_ROOT" >> "$GITHUB_ENV"

      - name: Install panel dependencies
        run: npm install --prefix "${PANEL_ROOT}" --no-audit --no-fund

      - name: Patch panel initial password support
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PANEL_ROOT"])
          p = root / "worker/src/lib/env.ts"
          s = p.read_text(encoding="utf-8")
          if "INITIAL_ADMIN_PASSWORD" not in s:
              marker = "  PUBLIC_BASE_URL: string;"
              if marker not in s:
                  raise SystemExit("Could not patch panel env.ts")
              s = s.replace(marker, marker + "\n  INITIAL_ADMIN_PASSWORD: string;", 1)
          p.write_text(s, encoding="utf-8")
          p = root / "worker/src/routes/auth.ts"
          s = p.read_text(encoding="utf-8")
          s = s.replace('if (password !== "admin") {', 'if (password !== c.env.INITIAL_ADMIN_PASSWORD) {', 1)
          s = s.replace('await bcrypt.hash("admin", 12)', 'await bcrypt.hash(c.env.INITIAL_ADMIN_PASSWORD, 12)', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build real panel frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path(os.environ["PANEL_ROOT"]) / "frontend/vite.config.ts"
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'(?m)^\s*base\s*:\s*["\'][^"\']*["\'],?\s*$', '', s)
          if "return {" not in s:
              raise SystemExit("Unexpected panel Vite config")
          s = s.replace("return {", 'return {\n    base: "/",', 1)
          p.write_text(s, encoding="utf-8")
          PY
          npm run build --prefix "${PANEL_ROOT}/frontend"
          test -s "${PANEL_ROOT}/frontend/dist/index.html"
          grep -Eqi 'pixel[[:space:]]*&[^<]*ping' "${PANEL_ROOT}/frontend/dist/index.html" || { echo "Real panel HTML was not produced"; exit 1; }
          ! grep -Fq 'PIXEL & PING — Deploy' "${PANEL_ROOT}/frontend/dist/index.html"
          ! grep -Fq 'pixel-and-ping-deployer1' "${PANEL_ROOT}/frontend/dist/index.html"

      - name: Build real panel Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > "${PANEL_ROOT}/worker/wrangler.panel-build.jsonc" <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "pixel-and-ping-panel-build",
            "main": "src/index.ts",
            "compatibility_date": "2026-08-31",
            "compatibility_flags": ["nodejs_compat"]
          }
          JSON
          rm -rf .panel-generated
          mkdir -p .panel-generated
          cd "${PANEL_ROOT}/worker"
          npx wrangler@4.131.1 deploy --dry-run --outfile "${GITHUB_WORKSPACE}/.panel-generated/worker.js" --config wrangler.panel-build.jsonc
          test -s "${GITHUB_WORKSPACE}/.panel-generated/worker.js"

      - name: Stage panel assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/public/panel-dist
          mkdir -p frontend/public/panel-dist
          cp -R "${PANEL_ROOT}/frontend/dist/." frontend/public/panel-dist/
          cp .panel-generated/worker.js worker/src/assets/panel-worker.bundle.txt
          test -s frontend/public/panel-dist/index.html
          test -s worker/src/assets/panel-worker.bundle.txt
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path("frontend/public/panel-dist")
          html = (root / "index.html").read_text(encoding="utf-8")
          if "PIXEL & PING — Deploy" in html or "pixel-and-ping-deployer1" in html:
              raise SystemExit("Deployer HTML detected in panel bundle")
          manifest = {}
          for f in sorted(root.rglob("*")):
              if f.is_file():
                  data = f.read_bytes()
                  manifest["/" + f.relative_to(root).as_posix()] = {
                      "hash": hashlib.sha256(data).hexdigest()[:32],
                      "size": len(data),
                  }
          Path("frontend/public/panel-manifest.json").write_text(
              json.dumps(manifest, separators=(",", ":")), encoding="utf-8"
          )
          print("Verified", len(manifest), "panel assets")
          PY

      - name: Add ASSETS binding to panel upload metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("worker/src/index.ts")
          s = p.read_text(encoding="utf-8")
          if '{ type: "assets", name: "ASSETS" }' not in s:
              needle = '      { type: "d1", name: "DB", database_id: d1Id },'
              if needle not in s:
                  raise SystemExit("Panel Worker D1 binding not found")
              s = s.replace(
                  needle,
                  '      { type: "assets", name: "ASSETS" },\n' + needle,
                  1,
              )
          p.write_text(s, encoding="utf-8")
          PY
          grep -F '{ type: "assets", name: "ASSETS" }' worker/src/index.ts
          grep -F 'https://assets.local/panel-dist${path}' worker/src/index.ts

      - name: Install deployer dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build deployer frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://pixel-and-ping-deployer1.fbtby.workers.dev
        run: npm run build

      - name: Verify final artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s frontend/dist/panel-manifest.json
          test -s frontend/dist/panel-dist/index.html
          test -s worker/src/assets/panel-worker.bundle.txt
          ! grep -Fq 'PIXEL & PING — Deploy' frontend/dist/panel-dist/index.html
          ! grep -Fq 'pixel-and-ping-deployer1' frontend/dist/panel-dist/index.html
          echo "Final panel artifact is isolated from deployer HTML."

      - name: Install Wrangler
        run: npm install --global wrangler@4.131.1

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-pages:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
