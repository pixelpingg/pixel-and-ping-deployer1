name: Deploy PIXEL & PING

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-ping-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy PIXEL & PING Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            frontend/package.json \
            frontend/vite.config.ts \
            worker/package.json \
            worker/wrangler.jsonc \
            worker/src/index.ts \
            worker/src/assets/panel-worker.bundle.txt
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done
          echo "Repository files verified."

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Copy panel Worker bundle into frontend assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/public
          cp worker/src/assets/panel-worker.bundle.txt frontend/public/panel-worker.bundle.txt
          test -s frontend/public/panel-worker.bundle.txt

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://pixel-and-ping-deployer1.fbtby.workers.dev
        run: npm run build

      - name: Verify frontend build
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -s frontend/dist/panel-worker.bundle.txt
          echo "Frontend build and panel bundle verified."

      - name: Install worker dependencies
        working-directory: worker
        run: npm install

      - name: Deploy Cloudflare Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-worker

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
