name: Deploy PIXEL & PING

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-ping-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy PIXEL & PING Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare real panel source
        shell: bash
        run: |
          set -euo pipefail
          test -s panel-source.zip
          rm -rf .panel-source
          mkdir -p .panel-source
          unzip -q panel-source.zip -d .panel-source
          PANEL_ROOT="$(find .panel-source -mindepth 1 -maxdepth 4 -type d -name frontend -print -quit | xargs -r dirname)"
          test -n "$PANEL_ROOT"
          test -d "$PANEL_ROOT/frontend"
          test -d "$PANEL_ROOT/worker"
          echo "PANEL_ROOT=$PANEL_ROOT" >> "$GITHUB_ENV"

      - name: Install panel dependencies
        run: npm install --prefix "${PANEL_ROOT}" --no-audit --no-fund

      - name: Patch panel initial admin password
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PANEL_ROOT"])

          p = root / "worker/src/lib/env.ts"
          s = p.read_text(encoding="utf-8")
          if "INITIAL_ADMIN_PASSWORD" not in s:
              marker = "  PUBLIC_BASE_URL: string;"
              if marker not in s:
                  raise SystemExit("Could not patch env.ts")
              s = s.replace(marker, marker + "\n  INITIAL_ADMIN_PASSWORD: string;", 1)
          p.write_text(s, encoding="utf-8")

          p = root / "worker/src/routes/auth.ts"
          s = p.read_text(encoding="utf-8")
          s = s.replace('if (password !== "admin") {', 'if (password !== c.env.INITIAL_ADMIN_PASSWORD) {', 1)
          s = s.replace('await bcrypt.hash("admin", 12)', 'await bcrypt.hash(c.env.INITIAL_ADMIN_PASSWORD, 12)', 1)
          p.write_text(s, encoding="utf-8")

          p = root / "frontend/src/pages/Login.tsx"
          if p.exists():
              s = p.read_text(encoding="utf-8")
              s = s.replace(
                  '<span className="text-slate-500">{t("auth.defaultPassword")}</span> <strong className="font-mono text-slate-100">admin</strong>',
                  '<span className="text-slate-500">Use the initial password provided by the deployer.</span>',
                  1,
              )
              p.write_text(s, encoding="utf-8")
          PY

      - name: Build real panel frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ["PANEL_ROOT"]) / "frontend/vite.config.ts"
          s = p.read_text(encoding="utf-8")
          s = s.replace(r'\n    base: "/",', '')
          s = re.sub(r'(?m)^\s*base\s*:\s*["\'][^"\']*["\'],?\s*$', '', s)
          if "return {" not in s:
              raise SystemExit("Unexpected panel Vite config")
          s = s.replace("return {", 'return {\n    base: "/",', 1)
          p.write_text(s, encoding="utf-8")
          PY
          npm run build --prefix "${PANEL_ROOT}/frontend"
          test -s "${PANEL_ROOT}/frontend/dist/index.html"
          python3 <<'PY'
          from pathlib import Path
          import os
          html = (Path(os.environ["PANEL_ROOT"]) / "frontend/dist/index.html").read_text(encoding="utf-8")
          if "PIXEL &amp; PING" not in html and "Pixel &amp; Ping" not in html and "Pixel & Ping" not in html:
              raise SystemExit("Real panel HTML was not produced")
          if "PIXEL & PING — Deploy" in html or "pixel-and-ping-deployer1" in html:
              raise SystemExit("Deployer HTML leaked into panel build")
          PY

      - name: Build real panel Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > "${PANEL_ROOT}/worker/wrangler.panel-build.jsonc" <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "pixel-and-ping-panel-build",
            "main": "src/index.ts",
            "compatibility_date": "2026-08-31",
            "compatibility_flags": ["nodejs_compat"]
          }
          JSON
          rm -rf .panel-generated
          mkdir -p .panel-generated
          cd "${PANEL_ROOT}/worker"
          npx wrangler@4.131.1 deploy --dry-run --outfile "${GITHUB_WORKSPACE}/.panel-generated/worker.js" --config wrangler.panel-build.jsonc
          test -s "${GITHUB_WORKSPACE}/.panel-generated/worker.js"

      - name: Create self-contained panel bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/public/__pixelping_panel
          mkdir -p frontend/public/__pixelping_panel
          cp -R "${PANEL_ROOT}/frontend/dist/." frontend/public/__pixelping_panel/
          cp .panel-generated/worker.js worker/src/assets/panel-worker.bundle.txt
          test -s frontend/public/__pixelping_panel/index.html
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path("frontend/public/__pixelping_panel")
          html = (root / "index.html").read_text(encoding="utf-8")
          if "PIXEL &amp; PING" not in html and "Pixel &amp; Ping" not in html and "Pixel & Ping" not in html:
              raise SystemExit("Panel index verification failed")
          if "PIXEL & PING — Deploy" in html or "pixel-and-ping-deployer1" in html:
              raise SystemExit("Deployer HTML detected in panel bundle")
          manifest = {}
          for f in sorted(root.rglob("*")):
              if f.is_file():
                  data = f.read_bytes()
                  manifest["/" + f.relative_to(root).as_posix()] = {
                      "hash": hashlib.sha256(data).hexdigest()[:32],
                      "size": len(data),
                  }
          Path("frontend/public/panel-manifest.json").write_text(json.dumps(manifest, separators=(",", ":")), encoding="utf-8")
          print(f"Verified {len(manifest)} real panel assets")
          PY

      - name: Patch deployer asset loader
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("worker/src/index.ts")
          s = p.read_text(encoding="utf-8")
          old = 'https://assets.local/panel-dist${path}'
          new = 'https://assets.local/__pixelping_panel${path}'
          if old not in s:
              raise SystemExit("Panel asset loader marker not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Add ASSETS binding to panel upload metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("worker/src/index.ts")
          s = p.read_text(encoding="utf-8")
          assets = '{ type: "assets", name: "ASSETS" }'
          if assets not in s:
              marker = '    bindings: [\n'
              if marker not in s:
                  raise SystemExit("Worker bindings block not found")
              s = s.replace(marker, marker + '      ' + assets + ',\n', 1)
          p.write_text(s, encoding="utf-8")
          PY
          grep -F '{ type: "assets", name: "ASSETS" }' worker/src/index.ts
      - name: Add post-deploy panel HTML verification
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("worker/src/index.ts")
          s = p.read_text(encoding="utf-8")
          marker = '''async function healthCheck(url: string) {'''
          fn = '''async function verifyPanelFrontend(url: string) {
          let last = "no response";
          for (let i = 0; i < 12; i++) {
          try {
          const response = await fetch(`${url}/`, { headers: { accept: "text/html" } });
          const type = response.headers.get("content-type") || "";
          const html = await response.text();
          const isPanel =
          /Pixel\\s*&(?:amp;)?\\s*Ping/i.test(html) &&
          !/PIXEL\\s*&\\s*PING\\s*[—-]\\s*Deploy/i.test(html) &&
          !html.includes("pixel-and-ping-deployer1");
          if (response.ok && type.toLowerCase().includes("text/html") && isPanel) return;
          last = `HTTP ${response.status}; content-type=${type}`;
          } catch (error) {
          last = error instanceof Error ? error.message : String(error);
          }
          await new Promise((resolve) => setTimeout(resolve, 1500));
          }
          throw new Error(`Panel frontend verification failed: ${last}`);
          }
          '''
          if "async function verifyPanelFrontend" not in s:
              if marker not in s:
                  raise SystemExit("healthCheck marker not found")
              s = s.replace(marker, fn + marker, 1)
          old = '''       step = "health";
          await this.set(step);
          await healthCheck(panelUrl);

          step = "admin";'''
          new = '''       step = "health";
          await this.set(step);
          await healthCheck(panelUrl);
          step = "frontend";
          await this.set(step);
          await verifyPanelFrontend(panelUrl);

          step = "admin";'''
          if old not in s:
              raise SystemExit("Deployment health block not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Install deployer dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build deployer frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://pixel-and-ping-deployer1.fbtby.workers.dev
        run: npm run build

      - name: Verify final deployer artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s frontend/dist/panel-manifest.json
          test -s frontend/dist/__pixelping_panel/index.html
          test -s worker/src/assets/panel-worker.bundle.txt
          python3 <<'PY'
          from pathlib import Path
          deployer = Path("frontend/dist/index.html").read_text(encoding="utf-8")
          panel = Path("frontend/dist/__pixelping_panel/index.html").read_text(encoding="utf-8")
          if "PIXEL & PING — Deploy" not in deployer:
              raise SystemExit("Deployer index verification failed")
          if "PIXEL & PING — Deploy" in panel or "pixel-and-ping-deployer1" in panel:
              raise SystemExit("Panel artifact contains deployer HTML")
          print("Final artifact verified: deployer and panel HTML are separate.")
          PY

      - name: Install Wrangler
        run: npm install --global wrangler@4.131.1

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-pages:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
