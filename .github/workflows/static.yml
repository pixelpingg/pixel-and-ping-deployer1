name: Deploy PIXEL & PING

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-ping-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy PIXEL & PING Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare real panel source
        shell: bash
        run: |
          set -euo pipefail
          test -s panel-source.zip
          rm -rf .panel-source
          mkdir -p .panel-source
          unzip -q panel-source.zip -d .panel-source

          PANEL_ROOT="$(find .panel-source -mindepth 1 -maxdepth 4 -type d -name frontend -print -quit | xargs -r dirname)"
          test -n "$PANEL_ROOT"
          test -d "$PANEL_ROOT/frontend"
          test -d "$PANEL_ROOT/worker"
          echo "PANEL_ROOT=$PANEL_ROOT" >> "$GITHUB_ENV"

      - name: Install panel dependencies
        shell: bash
        run: npm install --prefix "${PANEL_ROOT}" --no-audit --no-fund

      - name: Adapt panel for generated password
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PANEL_ROOT"])

          # worker/src/lib/env.ts
          p = root / "worker/src/lib/env.ts"
          s = p.read_text()
          if "INITIAL_ADMIN_PASSWORD" not in s:
              old = "  PUBLIC_BASE_URL: string;"
              new = "  PUBLIC_BASE_URL: string;\n  INITIAL_ADMIN_PASSWORD: string;"
              if old not in s:
                  raise SystemExit(f"Could not patch {p}: PUBLIC_BASE_URL not found")
              s = s.replace(old, new, 1)
          p.write_text(s)

          # worker/src/routes/auth.ts
          p = root / "worker/src/routes/auth.ts"
          s = p.read_text()
          if 'if (password !== "admin") {' in s:
              s = s.replace(
                  'if (password !== "admin") {',
                  'if (password !== c.env.INITIAL_ADMIN_PASSWORD) {',
                  1,
              )
          if 'await bcrypt.hash("admin", 12)' in s:
              s = s.replace(
                  'await bcrypt.hash("admin", 12)',
                  'await bcrypt.hash(c.env.INITIAL_ADMIN_PASSWORD, 12)',
                  1,
              )
          p.write_text(s)

          # frontend/src/pages/Login.tsx
          p = root / "frontend/src/pages/Login.tsx"
          s = p.read_text()
          old = '<span className="text-slate-500">{t("auth.defaultPassword")}</span> <strong className="font-mono text-slate-100">admin</strong>'
          new = '<span className="text-slate-500">Use the initial password provided by the deployer.</span>'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build real panel frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix "${PANEL_ROOT}/frontend"
          test -s "${PANEL_ROOT}/frontend/dist/index.html"

      - name: Build real panel Worker bundle
        shell: bash
        run: |
          set -euo pipefail

          cat > "${PANEL_ROOT}/worker/wrangler.panel-build.jsonc" <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "pixel-and-ping-panel-build",
            "main": "src/index.ts",
            "compatibility_date": "2026-08-31",
            "compatibility_flags": ["nodejs_compat"]
          }
          JSON

          rm -rf .panel-generated
          mkdir -p .panel-generated

          cd "${PANEL_ROOT}/worker"

          npx wrangler@4.131.1 deploy \
            --dry-run \
            --outfile "${GITHUB_WORKSPACE}/.panel-generated/worker.js" \
            --config wrangler.panel-build.jsonc

          test -s "${GITHUB_WORKSPACE}/.panel-generated/worker.js"
          echo "Panel Worker bundle created successfully."

      - name: Install deployer frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Prepare panel assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf frontend/public/panel-dist
          mkdir -p frontend/public/panel-dist

          cp .panel-generated/worker.js worker/src/assets/panel-worker.bundle.txt
          cp -R "${PANEL_ROOT}/frontend/dist/." frontend/public/panel-dist/

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path("frontend/public/panel-dist")
          manifest = {}

          for f in sorted(root.rglob("*")):
              if f.is_file():
                  data = f.read_bytes()
                  manifest["/" + f.relative_to(root).as_posix()] = {
                      "hash": hashlib.md5(data).hexdigest(),
                      "size": len(data),
                  }

          if "/index.html" not in manifest:
              raise SystemExit("Panel build missing index.html")

          Path("frontend/public/panel-manifest.json").write_text(
              json.dumps(manifest, separators=(",", ":"))
          )
          PY

          test -s frontend/public/panel-dist/index.html
          test -s frontend/public/panel-manifest.json
          test -s worker/src/assets/panel-worker.bundle.txt

      - name: Build deployer frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://pixel-and-ping-deployer1.fbtby.workers.dev
        run: npm run build

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s frontend/dist/panel-manifest.json
          test -s frontend/dist/panel-dist/index.html
          test -s worker/src/assets/panel-worker.bundle.txt
          echo "All build outputs are present."

      - name: Install Wrangler
        run: npm install --global wrangler@4.131.1

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy-pages:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-worker

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
